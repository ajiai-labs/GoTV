<!doctype html>
<html lang="de" data-design="modern">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="GoTV" />
		<title>GoTV</title>
		<meta
			name="description"
			content="GoTV: live Go broadcasts with the board next to the stream, a tournament calendar, Go channels and game replay with KataGo analysis - in the browser, on a tablet or as a desktop app."
		/>
		<script>
			// Apply the chosen design before the first paint (no flash of the other one).
			try {
				var d = localStorage.getItem('gotv.design');
				if (d === 'oldschool' || d === 'modern' || d === 'modern-dark')
					document.documentElement.dataset.design = d;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
