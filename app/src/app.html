<!doctype html>
<html lang="de" data-design="modern">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="GoTV" />
		<!-- Installable web app ("Zum Home-Bildschirm"); relative to the base path -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/gotv-256.png" />
		<title>GoTV</title>
		<!-- No text and data mining / AI training (user, 28.11.2026): GoTV shows
		     calendars, games and videos of third parties. Reservation of rights
		     in machine-readable form - W3C TDMRep and the "noai" robots values;
		     search engines may still index the pages. -->
		<meta name="tdm-reservation" content="1" />
		<meta name="robots" content="noai, noimageai" />
		<meta
			name="description"
			content="GoTV: live Go broadcasts with the board next to the stream, a tournament calendar, Go channels and game replay with KataGo analysis - in the browser, on a tablet or as a desktop app."
		/>
		<script>
			// Apply the chosen design and language before the first paint (no flash of the other one).
			try {
				var d = localStorage.getItem('gotv.design');
				if (d === 'oldschool' || d === 'modern' || d === 'modern-dark')
					document.documentElement.dataset.design = d;
			} catch (e) {}
			// The interface language (src/lib/i18n/index.svelte.ts) for <html lang>.
			try {
				var l = localStorage.getItem('gotv.language');
				if (l !== 'de' && l !== 'en') l = /^de/i.test(navigator.language || '') ? 'de' : 'en';
				document.documentElement.lang = l;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
