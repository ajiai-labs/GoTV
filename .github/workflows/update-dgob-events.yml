name: Update DGoB events

# Daily import of German Go Federation (DGoB) tournament events into
# public/tv/events.json - see tools/update_events.py (--source dgob) and
# AGENTS.md. Runs unattended and commits directly to the default branch
# (no PR review) - see the "Fehler-Alarm" steps below for why.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-dgob-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # NOTE: this project's Python tooling is standard-library-only by
      # design (AGENTS.md / "keine neuen schweren Dependencies") and has
      # no pytest dependency anywhere - run via unittest instead, which
      # covers the same import/link tests without adding one. See the
      # task report for this deliberate deviation from the literal
      # "pytest" wording.
      - name: Run import/link tests
        id: tests
        run: |
          python3 -m unittest tools.test_update_events tools.test_check_links tools.test_speedgo tools.test_youtube_videos -v 2>&1 | tee /tmp/dgob-workflow.log

      - name: Import DGoB events
        id: import
        run: |
          python3 tools/update_events.py --source dgob 2>&1 | tee -a /tmp/dgob-workflow.log

      # EGF Twitch schedule (official iCalendar, no login/key/client id).
      # 154830311 = broadcaster_id of twitch.tv/europeangofederation,
      # verified 2026-11-13: decapi.me lookup + the iCalendar itself
      # answers with X-WR-CALNAME:EuropeanGoFederation.
      - name: Import EGF Twitch schedule
        id: import_twitch
        run: |
          python3 tools/update_events.py --source twitch-egf --broadcaster-id 154830311 2>&1 | tee -a /tmp/dgob-workflow.log

      # The other Twitch channels of events.json, same keyless iCalendar
      # (broadcaster ids in TWITCH_CHANNELS, looked up 2026-11-28 via
      # decapi.me and checked against the iCalendar's X-WR-CALNAME). One
      # channel failing must not stop the others.
      - name: Import other Twitch schedules
        id: import_twitch_more
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          for login in usgoweb yungusengdojang; do
            python3 tools/update_events.py --source twitch --twitch-channel "$login" 2>&1 | tee -a /tmp/dgob-workflow.log || status=1
          done
          exit $status

      # EGF Grand Prix circuit calendar (server-rendered HTML, no API -
      # see tools/update_events.py's EGF_CALENDAR_* section). German
      # entries are skipped by the importer itself (DGOB_CATEGORIES/
      # hand-curation already owns them) - no overlap with the two steps
      # above.
      - name: Import EGF Grand Prix calendar
        id: import_egf_calendar
        run: |
          python3 tools/update_events.py --source egf-calendar 2>&1 | tee -a /tmp/dgob-workflow.log

      # Speed Go Championship bracket (speedgochampionship.com/bracket, see
      # tools/speedgo.py): upcoming matches as entries, OGS games of played
      # matches added to the entry of the same pairing. Last, so it also
      # reaches entries the Twitch import above has just rewritten.
      # A website, not an API: if it is down or redesigned, the other
      # sources still get committed; the failure alarm below reports it.
      - name: Import Speed Go bracket
        id: import_speedgo
        continue-on-error: true
        run: |
          python3 tools/update_events.py --source speedgo 2>&1 | tee -a /tmp/dgob-workflow.log

      # Newest videos of the YouTube channels (official channel feed, no
      # key - tools/youtube_videos.py) into the "videos" array. A feed that
      # fails keeps its channel's videos; the alarm below reports it.
      - name: Import YouTube channel videos
        id: import_youtube
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/update_events.py --source youtube-rss 2>&1 | tee -a /tmp/dgob-workflow.log

      # A broken/dead link must turn this run red, but must never block
      # the events.json update that already happened above - continued
      # below in "Commit and push" regardless of this step's result.
      - name: Check links
        id: check_links
        continue-on-error: true
        run: |
          python3 tools/check_links.py 2>&1 | tee -a /tmp/dgob-workflow.log

      - name: Commit and push if events.json changed
        id: commit
        run: |
          if git diff --quiet -- public/tv/events.json; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/tv/events.json
            git commit -m "chore(tv): update DGoB/EGF/Speed Go events"
            git push
          fi

      # --- Fehler-Alarm (point 9): this job commits directly to the
      # default branch with no human review, so a failure here needs to
      # surface somewhere a human will actually see it. Scoped to
      # tests/import/commit only - check_links already turns the job red
      # on its own (above) without needing a duplicate issue for every
      # transient dead link.
      - name: Close a stale failure issue once the import succeeds again
        if: >-
          always() &&
          steps.tests.outcome == 'success' &&
          steps.import.outcome == 'success' &&
          steps.import_twitch.outcome == 'success' &&
          steps.import_twitch_more.outcome == 'success' &&
          steps.import_egf_calendar.outcome == 'success' &&
          steps.import_speedgo.outcome == 'success' &&
          steps.import_youtube.outcome == 'success' &&
          steps.commit.outcome == 'success'
        run: |
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]; then
            echo "Issues sind im Repository aus - nichts zu schließen."
            exit 0
          fi
          issue_number=$(gh issue list --search '"DGoB-Import fehlgeschlagen" in:title' --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "wieder erfolgreich: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$issue_number"
          fi

      - name: Open or update the failure issue
        if: >-
          always() &&
          (steps.tests.outcome == 'failure' ||
           steps.import.outcome == 'failure' ||
           steps.import_twitch.outcome == 'failure' ||
           steps.import_twitch_more.outcome == 'failure' ||
           steps.import_egf_calendar.outcome == 'failure' ||
           steps.import_speedgo.outcome == 'failure' ||
           steps.import_youtube.outcome == 'failure' ||
           steps.commit.outcome == 'failure')
        run: |
          # Issues switched off in the repository (28.11.2026): the red run
          # (GitHub's mail about a failed workflow) is the alarm.
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]; then
            echo "Import fehlgeschlagen - Issues sind aus, der rote Lauf ist der Alarm."
            tail -n 60 /tmp/dgob-workflow.log 2>/dev/null || true
            exit 1
          fi
          gh label create tv-import --color ededed --description "DGoB-Import-Alarm" 2>/dev/null || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          error_tail=$(tail -n 60 /tmp/dgob-workflow.log 2>/dev/null || echo "(kein Log verfügbar)")
          body=$(printf 'Lauf fehlgeschlagen: %s\n\n```\n%s\n```\n' "$run_url" "$error_tail")
          issue_number=$(gh issue list --search '"DGoB-Import fehlgeschlagen" in:title' --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "DGoB-Import fehlgeschlagen" --label tv-import --body "$body"
          fi

      # Keep last, after the alert steps above, so it doesn't mask the
      # tests/import/commit outcomes those steps key off of.
      - name: Fail the job if the link check found a broken link
        if: steps.check_links.outcome == 'failure'
        run: exit 1
