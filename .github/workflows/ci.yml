name: Tests und Web-Version

# Every push and pull request: lint, Flow, unit tests (app + Python tools)
# and the production build. On master the web version without KGS
# ("yarn build:pages", guest TV only) is then published on GitHub Pages:
# https://ajiai-labs.github.io/GoTV/
#
# The daily calendar import commits with GITHUB_TOKEN, which starts no
# workflow - the web version still shows new dates, because it loads
# events.json from GitHub at runtime (REMOTE_EVENTS_URL).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Flow
        run: yarn flow

      - name: Unit tests (app)
        run: yarn test --watchAll=false --testPathPattern="src/(model|util|ui)"
        env:
          CI: "true"

      - name: Unit tests (Python tools)
        run: python3 -m unittest tools.test_update_events tools.test_check_links tools.test_refresh_tv_events tools.test_speedgo -v

      - name: Build
        run: |
          yarn build
          if grep -rl "GO-TV-DEV-HARNESS" build/; then
            echo "Dev harness leaked into the production build" >&2
            exit 1
          fi

  # The new Svelte 5 + TypeScript app in app/ (docs/umbau-svelte.md). Its
  # component tests run in Chromium and in WebKit - Safari's engine, as on the
  # iPad - so every change is checked for the tablet too.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install test browsers (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Tests (Chromium + WebKit)
        run: npm test
        env:
          TEST_BROWSERS: chromium,webkit

      - name: Build (web version path)
        run: npm run build
        env:
          BASE_PATH: /GoTV

  pages-build:
    needs: [test, app]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build web version
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build:pages

      # Preview of the new interface (docs/umbau-svelte.md) under /GoTV/neu/
      - name: Build new interface preview
        working-directory: app
        run: |
          npm ci
          BASE_PATH=/GoTV/neu npm run build
          cp -r build ../build/neu

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
