name: Tests und Web-Version

# Every push and pull request: the app in app/ (type check, lint, tests in
# Chromium and WebKit, build), the Python tools and the desktop server. On
# master the web version without KGS (guest TV only) is then published on
# GitHub Pages: https://ajiai-labs.github.io/GoTV/
#
# The daily calendar import commits with GITHUB_TOKEN, which starts no
# workflow - the web version still shows new dates, because it loads
# events.json from GitHub at runtime (REMOTE_EVENTS_URL).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Calendar importers and link check (tools/).
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests (Python tools)
        run: python3 -m unittest tools.test_update_events tools.test_check_links tools.test_refresh_tv_events tools.test_speedgo tools.test_fake_kgs tools.test_script_update tools.test_youtube_videos tools.test_kgs_log -v

  # The GoTV app (Svelte 5 + TypeScript, app/). Its component tests run in
  # Chromium and in WebKit - Safari's engine, as on the iPad - so every
  # change is checked for the tablet too.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install test browsers (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Tests (Chromium + WebKit)
        run: npm test
        env:
          TEST_BROWSERS: chromium,webkit

      - name: Build (web version path)
        run: npm run build
        env:
          BASE_PATH: /GoTV

  # Local server of the Tauri desktop apps (desktop/tauri/, released by
  # desktop.yml): routing, DNS-rebinding guard, KGS proxy against a fake
  # upstream. Needs no webkit - gotv-server has no Tauri dependency.
  desktop-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/tauri -> target

      - name: Tests
        run: cargo test -p gotv-server --locked

  pages-build:
    needs: [tools, app]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build web version
        run: |
          npm ci
          VITE_GUEST_ONLY=true BASE_PATH=/GoTV npm run build
          # Unknown paths load the app (single-page fallback).
          cp build/index.html build/404.html
          # Old addresses lead to the same place: the preview of the new
          # interface (/GoTV/neu/, until 25.11.2026) and the guest page of the
          # old app (/GoTV/tv).
          mkdir -p build/neu
          cat > build/neu/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>GoTV</title>
          <meta http-equiv="refresh" content="0; url=/GoTV/">
          <script>location.replace(location.href.replace('/GoTV/neu', '/GoTV'));</script>
          <a href="/GoTV/">GoTV</a>
          HTML
          sed 's#/GoTV/neu#/GoTV/tv#' build/neu/index.html > build/tv/index.html

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
