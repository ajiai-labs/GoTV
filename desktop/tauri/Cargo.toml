# GoTV desktop apps (Windows, macOS, Linux) - see README.md.
[workspace]
resolver = "2"
members = ["gotv-server", "gotv-desktop"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ajiai-labs/GoTV"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
